# PEP 735 dependency groups for the integration test environments: one group per integration, pinning the
# framework versions it is tested against. Kept out of the root lock (frameworks pin versions that can't share one
# environment, and a universal lock over all of them takes many minutes). Used by scripts/integration.sh:
#   uv pip install -e ".[laya]" --group tests/integrations/pyproject.toml:int-<name>

[dependency-groups]
int-base = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "pyyaml>=6", "torch>=2.2", "numpy>=1.24"]
int-litellm = [{ include-group = "int-base" }, "litellm==1.102.1"]
int-langchain = [{ include-group = "int-base" }, "langchain-core==1.6.5", "langchain-openai==1.6.6", "langchain-anthropic==1.7.4", "langchain-google-genai==4.4.0", "langchain-aws==1.7.9", "langchain-mistralai==1.1.6", "langchain-groq==1.1.3", "langchain-ollama==1.1.0", "langchain-huggingface==1.2.2", "langchain-fireworks==1.6.2", "langchain-together==0.4.0"]
int-crewai = [{ include-group = "int-base" }, "crewai[anthropic,google-genai,azure-ai-inference]==1.15.22; python_version < '3.14'", "anthropic==0.73.0; python_version < '3.14'", "google-genai==1.65.0; python_version < '3.14'", "azure-ai-inference==1.0.0b9; python_version < '3.14'"]
int-pydantic-ai = [{ include-group = "int-base" }, "pydantic-ai-slim[openai,anthropic,google,groq,mistral,bedrock]==2.50.0"]
int-haystack = [{ include-group = "int-base" }, "haystack-ai==3.2.0", "anthropic-haystack==6.2.0", "google-genai-haystack==6.0.0", "ollama-haystack==7.0.1", "huggingface-api-haystack==1.0.0", "huggingface-hub==1.33.0"]
int-smolagents = [{ include-group = "int-base" }, "smolagents[openai,litellm,transformers]==1.26.0"]
int-autogen = [{ include-group = "int-base" }, "autogen-agentchat==0.7.5", "autogen-ext[openai,anthropic,ollama]==0.7.5", "anthropic==1.8.0", "ollama==0.6.2"]
int-semantic-kernel = [{ include-group = "int-base" }, "semantic-kernel[anthropic,ollama]==1.44.1", "azure-ai-agents>=1.2.0b3", "anthropic==0.125.0", "ollama==0.6.2"]
int-dspy = [{ include-group = "int-base" }, "dspy==3.4.0"]
int-llamaindex = [{ include-group = "int-base" }, "llama-index-core==0.14.25", "llama-index-llms-openai==0.7.9", "llama-index-llms-anthropic==0.12.0", "llama-index-llms-google-genai==0.11.2", "llama-index-llms-bedrock-converse==0.15.0", "llama-index-llms-azure-openai==0.6.1", "llama-index-llms-mistralai==0.11.0", "llama-index-llms-groq==0.6.1", "llama-index-llms-ollama==0.11.0", "llama-index-llms-huggingface-api==0.8.0"]
int-openai = [{ include-group = "int-base" }, "openai==3.19.2"]
int-instructor = [{ include-group = "int-base" }, "instructor==1.17.0", "openai==2.54.0"]
int-portkey = [{ include-group = "int-base" }]
int-llm-plugin = [{ include-group = "int-base" }, "llm==0.36"]
int-outlines = [{ include-group = "int-base" }, "outlines==1.3.3; python_version < '3.14'", "openai==3.19.2", "ollama==0.6.2"]
int-marvin = [{ include-group = "int-base" }, "marvin==3.2.7", "pydantic-ai==1.69.0"]
int-langgraph = [{ include-group = "int-base" }, "langgraph==1.2.12", "langchain-core==1.6.5"]
int-openai-agents = [{ include-group = "int-base" }, "openai-agents[litellm]==0.22.3"]
int-claude-agent-sdk = [{ include-group = "int-base" }, "claude-agent-sdk==0.2.159"]
int-google-adk = [{ include-group = "int-base" }, "google-adk==2.9.2"]
int-agno = [{ include-group = "int-base" }, "agno==3.0.11", "openai==3.19.2", "anthropic==1.8.0", "google-genai==2.25.0", "ollama==0.6.2"]
