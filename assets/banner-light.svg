<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">decisionsmith</title>
  <desc id="d">A small model copies an expensive LLM's homework, answer by answer, and gets an A+ for it.</desc>

  <rect width="1200" height="400" rx="24" fill="#f8fafc"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="600" y="64" font-size="15" text-anchor="middle" fill="#64748b">mode="shadow"  (the student is watching)</text>
    <text x="600" y="118" font-size="52" font-weight="700" text-anchor="middle" fill="#0f172a">decisionsmith</text>
    <text x="600" y="154" font-size="20" text-anchor="middle" fill="#334155">Let the expensive model do the homework.</text>
    <text x="600" y="180" font-size="20" text-anchor="middle" fill="#64748b">Copy it until you stop needing it.</text>

    <!-- the teacher's sheet -->
    <rect x="200" y="206" width="320" height="130" rx="10" fill="#ffffff" stroke="#d5dde8"/>
    <line x1="218" y1="218" x2="218" y2="324" stroke="#fecaca" stroke-width="2"/>
    <text x="232" y="236" font-size="13" fill="#64748b">TEACHER  (paid per answer)</text>
    <g font-size="16" fill="#0f172a">
      <text x="232" y="266">team ...... billing</text>
      <text x="232" y="292">refund .... yes</text>
      <text x="232" y="318">mood ...... furious</text>
    </g>

    <!-- the copying -->
    <path d="M548 271 H640" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
    <path d="M638 263 L652 271 L638 279" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <text x="600" y="254" font-size="15" text-anchor="middle" fill="#334155">copies</text>
    <text x="600" y="302" font-size="13" text-anchor="middle" fill="#64748b">(every answer)</text>

    <!-- the student's sheet -->
    <rect x="680" y="206" width="320" height="130" rx="10" fill="#ffffff" stroke="#d5dde8"/>
    <line x1="698" y1="218" x2="698" y2="324" stroke="#fecaca" stroke-width="2"/>
    <text x="712" y="236" font-size="13" fill="#64748b">STUDENT  (free, local)</text>
    <g font-size="16" fill="#0f172a">
      <text x="712" y="266">team ...... billing</text>
      <text x="712" y="292">refund .... yes</text>
      <text x="712" y="318">mood ...... furious</text>
    </g>
    <circle cx="950" cy="276" r="34" fill="none" stroke="#ea580c" stroke-width="4"/>
    <text x="950" y="285" font-size="26" font-weight="700" text-anchor="middle" fill="#ea580c">A+</text>
  </g>
</svg>
