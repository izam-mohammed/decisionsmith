name: Feature request
description: Suggest an improvement or a new integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could look from the user's side (a snippet or CLI command helps).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is a new integration with another framework or tool
