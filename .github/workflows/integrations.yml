name: integrations
on:
  push:
    branches: [main]
  pull_request:

# One job per framework: each `int-<name>` group in tests/integrations/pyproject.toml pins the tested versions,
# and frameworks never share an environment. Runs the integration's tests and its examples offline (DS_OFFLINE=1, tiny Laya checkpoint).
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        name: [litellm, openai, instructor, portkey, llm-plugin, outlines, marvin, langchain, llamaindex, dspy, crewai, pydantic-ai, haystack, smolagents, autogen, semantic-kernel, langgraph, openai-agents, claude-agent-sdk, google-adk]
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: scripts/integration.sh ${{ matrix.name }} .venv-int
