name: integrations
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# One job per framework: each `int-<name>` group in tests/integrations/pyproject.toml pins the tested versions,
# and frameworks never share an environment. Runs the integration's tests and its examples offline (DS_OFFLINE=1,
# tiny Laya checkpoint). A pull request runs only the integrations whose module, test or examples changed, and all
# of them when a core file changes (scripts/changed_integrations.py); a manual run starts all of them.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      names: ${{ steps.pick.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            names=$(git diff --name-only "$BASE"...HEAD | uv run --no-project --python 3.12 python scripts/changed_integrations.py)
          else
            names=$(uv run --no-project --python 3.12 python scripts/changed_integrations.py --all < /dev/null)
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "integrations to run: $names"

  integration:
    needs: changes
    if: needs.changes.outputs.names != '[]'
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.names) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      NAME: ${{ matrix.name }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: scripts/integration.sh "$NAME" .venv-int
