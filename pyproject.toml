[project]
name = "decisionsmith"
version = "0.1.0"
description = "Use and fine-tune System One models (Jev, Laya) on your data, with an LLM as the teacher."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Izam Mohammed", email = "izamdeveloper1@gmail.com" }]
requires-python = ">=3.10"
keywords = ["laya", "jev", "system-one", "classification", "llm", "distillation", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
laya = ["laya>=0.3.20,<0.4"]
anthropic = ["anthropic>=1.0"]
mcp = ["mcp>=2.2"]
all = ["decisionsmith[laya,anthropic,mcp]"]
litellm = ["litellm>=1.70"]
langchain = ["langchain-core>=1.0"]
llamaindex = ["llama-index-core>=0.12"]
dspy = ["dspy>=3.0"]
semantic-kernel = ["semantic-kernel>=1.0"]
autogen = ["autogen-core>=0.4"]
smolagents = ["smolagents>=1.0"]
haystack = ["haystack-ai>=2.0"]
pydantic-ai = ["pydantic-ai-slim>=1.0"]
crewai = ["crewai>=1.0; python_version < '3.14'"]

[project.scripts]
decisionsmith = "decisionsmith.cli:main"

[project.urls]
Homepage = "https://github.com/izam-mohammed/decisionsmith"
Issues = "https://github.com/izam-mohammed/decisionsmith/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pyyaml>=6",
    "torch>=2.2",
    "numpy>=1.24",
    "anthropic>=1.0",
]
int-base = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "pyyaml>=6", "torch>=2.2", "numpy>=1.24"]
int-litellm = [{ include-group = "int-base" }, "litellm==1.102.1"]
int-langchain = [{ include-group = "int-base" }, "langchain-core==1.6.5", "langchain-openai==1.6.6"]
int-crewai = [{ include-group = "int-base" }, "crewai==1.15.22; python_version < '3.14'"]
int-pydantic-ai = [{ include-group = "int-base" }, "pydantic-ai-slim[openai]==2.50.0"]
int-haystack = [{ include-group = "int-base" }, "haystack-ai==3.2.0"]
int-smolagents = [{ include-group = "int-base" }, "smolagents[openai]==1.26.0"]
int-autogen = [{ include-group = "int-base" }, "autogen-agentchat==0.7.5", "autogen-ext[openai]==0.7.5"]
int-semantic-kernel = [{ include-group = "int-base" }, "semantic-kernel==1.44.1", "azure-ai-agents>=1.2.0b3"]
int-dspy = [{ include-group = "int-base" }, "dspy==3.4.0"]
int-llamaindex = [{ include-group = "int-base" }, "llama-index-core==0.14.25", "llama-index-llms-openai==0.8.2"]

[tool.uv]
default-groups = ["dev"]
# Generated by scripts/sync_conflicts.py: frameworks never share an environment; CrewAI and Semantic Kernel pin mcp < 2.
conflicts = [
  [
    { extra = "autogen" },
    { extra = "crewai" },
    { extra = "dspy" },
    { extra = "haystack" },
    { extra = "langchain" },
    { extra = "litellm" },
    { extra = "llamaindex" },
    { extra = "pydantic-ai" },
    { extra = "semantic-kernel" },
    { extra = "smolagents" },
    { group = "int-autogen" },
    { group = "int-crewai" },
    { group = "int-dspy" },
    { group = "int-haystack" },
    { group = "int-langchain" },
    { group = "int-litellm" },
    { group = "int-llamaindex" },
    { group = "int-pydantic-ai" },
    { group = "int-semantic-kernel" },
    { group = "int-smolagents" },
  ],
  [{ group = "int-crewai" }, { extra = "mcp" }],
  [{ extra = "crewai" }, { extra = "mcp" }],
  [{ group = "int-crewai" }, { extra = "all" }],
  [{ extra = "crewai" }, { extra = "all" }],
  [{ group = "int-semantic-kernel" }, { extra = "mcp" }],
  [{ extra = "semantic-kernel" }, { extra = "mcp" }],
  [{ group = "int-semantic-kernel" }, { extra = "all" }],
  [{ extra = "semantic-kernel" }, { extra = "all" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ERA"]
ignore = ["RUF001", "RUF002", "RUF003", "UP031", "B905", "RUF007", "SIM108", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM115", "B018", "RUF059", "RUF043", "E501", "B007"]

[tool.mypy]
python_version = "3.12"
files = ["src/decisionsmith"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs real model weights or network (skipped by default)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["decisionsmith"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
