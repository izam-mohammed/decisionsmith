[project]
name = "decisionsmith"
version = "0.1.0"
description = "Use and fine-tune System One models (Jev, Laya) on your data, with an LLM as the teacher."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Izam Mohammed", email = "izamdeveloper1@gmail.com" }]
requires-python = ">=3.10"
keywords = ["laya", "jev", "system-one", "classification", "llm", "distillation", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
laya = ["laya>=0.3.20,<0.4"]
anthropic = ["anthropic>=1.0"]
mcp = ["mcp>=2.2"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
all = ["decisionsmith[laya,anthropic,mcp,serve]"]
litellm = ["litellm>=1.70"]
langchain = ["langchain-core>=1.0"]
llamaindex = ["llama-index-core>=0.12"]
dspy = ["dspy>=3.0"]
semantic-kernel = ["semantic-kernel>=1.0"]
autogen = ["autogen-core>=0.4"]
smolagents = ["smolagents>=1.0"]
haystack = ["haystack-ai>=2.0"]
pydantic-ai = ["pydantic-ai-slim>=1.0"]
crewai = ["crewai>=1.0; python_version < '3.14'"]
openai = ["openai>=1.40"]
instructor = ["instructor>=1.10"]
llm-plugin = ["llm>=0.26"]
outlines = ["outlines>=1.0; python_version < '3.14'"]
langgraph = ["langgraph>=1.0"]
openai-agents = ["openai-agents>=0.20"]
claude-agent-sdk = ["claude-agent-sdk>=0.2"]
google-adk = ["google-adk>=2.0"]
agno = ["agno>=3.0"]

[project.scripts]
decisionsmith = "decisionsmith.cli:main"

[project.entry-points.llm]
decisionsmith = "decisionsmith.integrations.llm_plugin"

[project.urls]
Homepage = "https://github.com/izam-mohammed/decisionsmith"
Issues = "https://github.com/izam-mohammed/decisionsmith/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pyyaml>=6",
    "torch>=2.2",
    "numpy>=1.24",
    "anthropic>=1.0",
    "matplotlib>=3.8",
]

[tool.uv]
default-groups = ["dev"]
# CrewAI and Semantic Kernel pin mcp < 2, so they never share the lock with the mcp extra. Integration test
# environments are not in this lock: see tests/integrations/pyproject.toml.
conflicts = [
  [{ extra = "crewai" }, { extra = "mcp" }],
  [{ extra = "crewai" }, { extra = "all" }],
  [{ extra = "semantic-kernel" }, { extra = "mcp" }],
  [{ extra = "semantic-kernel" }, { extra = "all" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ERA"]
ignore = ["RUF001", "RUF002", "RUF003", "UP031", "B905", "RUF007", "SIM108", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM115", "B018", "RUF059", "RUF043", "E501", "B007"]

[tool.mypy]
python_version = "3.12"
files = ["src/decisionsmith"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs real model weights or network (skipped by default)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["decisionsmith"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
