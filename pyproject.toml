[project]
name = "decisionsmith"
version = "0.1.0"
description = "Use and fine-tune System One models (Jev, Laya) on your data, with an LLM as the teacher."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Izam Mohammed", email = "izamdeveloper1@gmail.com" }]
requires-python = ">=3.10"
keywords = ["laya", "jev", "system-one", "classification", "llm", "distillation", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
laya = ["laya>=0.3.20,<0.4"]
llm = ["litellm>=1.50", "instructor>=1.6"]
mcp = ["mcp>=2.2"]
all = ["decisionsmith[laya,llm,mcp]"]

[project.scripts]
decisionsmith = "decisionsmith.cli:main"

[project.urls]
Homepage = "https://github.com/izam-mohammed/decisionsmith"
Issues = "https://github.com/izam-mohammed/decisionsmith/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pyyaml>=6",
    "torch>=2.2",
    "numpy>=1.24",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ERA"]
ignore = ["RUF001", "RUF002", "RUF003", "UP031", "B905", "RUF007", "SIM108", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM115", "B018", "RUF059", "RUF043", "E501", "B007"]

[tool.mypy]
python_version = "3.12"
files = ["src/decisionsmith"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs real model weights or network (skipped by default)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["decisionsmith"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
